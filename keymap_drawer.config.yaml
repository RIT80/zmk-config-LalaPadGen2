draw_config:
  dark_mode: auto

parse_config:
  raw_binding_map:
    "&mkp LCLK": LCLK
    "&mkp RCLK": RCLK
    "&mkp MCLK": MCLK
    "&bt BT_SEL 0":
      shifted: ""
      tap: $$mdi:bluetooth-connect$$
      hold: 1
    "&bt BT_SEL 1":
      shifted: ""
      tap: $$mdi:bluetooth-connect$$
      hold: 2
    "&bt BT_SEL 2":
      shifted: ""
      tap: $$mdi:bluetooth-connect$$
      hold: 3
    "&bt BT_SEL 3":
      shifted: ""
      tap: $$mdi:bluetooth-connect$$
      hold: 4
    "&bt BT_SEL 4":
      shifted: ""
      tap: $$mdi:bluetooth-connect$$
      hold: 5
  zmk_combos:
    MiddleClick: { align: top, o: 0.15 }
